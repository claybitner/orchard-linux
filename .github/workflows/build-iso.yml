name: Build MacBook CachyOS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build.sh"
      - "scripts/**"
      - "overlay/**"
      - ".github/workflows/build-iso.yml"
  pull_request:
    paths:
      - "build.sh"
      - "scripts/**"
      - "overlay/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Bash syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(
            find . -type f \
              \( -name '*.sh' -o -path './overlay/airootfs/usr/local/bin/*' \
                 -o -path './overlay/airootfs/usr/lib/macbook-cachyos/*' \) \
              -print0
          )

      - name: ShellCheck
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -d '' files < <(
            find . -type f \
              \( -name '*.sh' -o -path './overlay/airootfs/usr/local/bin/*' \
                 -o -path './overlay/airootfs/usr/lib/macbook-cachyos/*' \) \
              -print0
          )
          shellcheck --severity=warning "${files[@]}"

      - name: Unit tests
        shell: bash
        run: |
          ./tests/test-package-list.sh
          ./tests/test-calamares-patch.sh

  build:
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: archlinux:base-devel
      options: --privileged

    steps:
      - name: Configure CachyOS repository
        shell: bash
        run: |
          set -Eeuo pipefail
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed sudo git
          pacman-key --init
          pacman-key --recv-keys F3B607488DB35A47 \
            --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key F3B607488DB35A47
          sed -i '/^\[core\]$/i[cachyos]\nServer = https://mirror.cachyos.org/repo/$arch/$repo\n' \
            /etc/pacman.conf
          pacman -Syu --noconfirm

      - uses: actions/checkout@v6

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          pacman -S --noconfirm --needed \
            archiso cachyos-keyring mkinitcpio-archiso \
            rsync squashfs-tools grub

      - name: Clone current CachyOS ISO source
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth 1 \
            https://github.com/CachyOS/CachyOS-Live-ISO.git \
            /work/CachyOS-Live-ISO

      - name: Apply overlay and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          ./build.sh \
            --upstream /work/CachyOS-Live-ISO \
            --name macbook-cachyos \
            --no-build

      - name: Build ISO
        working-directory: /work/CachyOS-Live-ISO
        shell: bash
        run: |
          set -Eeuo pipefail
          ./buildiso.sh -p desktop -v -w 2>&1 | tee /tmp/build.log

      - name: Generate checksums
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          cd /work/CachyOS-Live-ISO/out/desktop
          sha256sum -- ./*.iso > SHA256SUMS

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p /tmp/diagnostics
          cp /tmp/build.log /tmp/diagnostics/ 2>/dev/null || true
          find /work/CachyOS-Live-ISO -maxdepth 3 -type f \
            \( -name '*.log' -o -name 'packages*.x86_64' \) \
            -exec cp --parents {} /tmp/diagnostics/ \; 2>/dev/null || true

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: macbook-cachyos-iso
          path: |
            /work/CachyOS-Live-ISO/out/desktop/*.iso
            /work/CachyOS-Live-ISO/out/desktop/*.pkgs.txt
            /work/CachyOS-Live-ISO/out/desktop/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: /tmp/diagnostics
          if-no-files-found: ignore
          retention-days: 7
