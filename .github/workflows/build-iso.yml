name: Build MacBook CachyOS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build.sh"
      - "scripts/**"
      - "overlay/**"
      - ".github/workflows/build-iso.yml"
  pull_request:
    paths:
      - "build.sh"
      - "scripts/**"
      - "overlay/**"
      - ".github/workflows/build-iso.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Bash syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(
            find . -type f \
              \( -name '*.sh' -o -path './overlay/airootfs/usr/local/bin/*' \
                 -o -path './overlay/airootfs/usr/lib/macbook-cachyos/*' \) \
              -print0
          )

      - name: ShellCheck
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -d '' files < <(
            find . -type f \
              \( -name '*.sh' -o -path './overlay/airootfs/usr/local/bin/*' \
                 -o -path './overlay/airootfs/usr/lib/macbook-cachyos/*' \) \
              -print0
          )
          shellcheck --severity=warning "${files[@]}"

      - name: Unit tests
        shell: bash
        run: |
          ./tests/test-package-list.sh
          ./tests/test-calamares-patch.sh
          ./tests/test-upstream-build-integration.sh

  build:
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6

      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          tool-cache: false
          swap-storage: false

      - name: Build ISO in Arch Linux
        shell: bash
        run: |
          set -Eeuo pipefail
          df -h /
          docker run --privileged --rm -i \
            --env USER=root \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            archlinux:base-devel \
            bash -s <<'CONTAINER_SCRIPT'
          set -Eeuo pipefail

          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed sudo git
          pacman-key --init
          pacman-key --recv-keys F3B607488DB35A47 \
            --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key F3B607488DB35A47
          sed -i '/^\[core\]$/i[cachyos]\nServer = https://mirror.cachyos.org/repo/$arch/$repo\n' \
            /etc/pacman.conf
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            archiso cachyos-keyring mkinitcpio-archiso \
            rsync squashfs-tools grub

          git clone --depth 1 \
            https://github.com/CachyOS/CachyOS-Live-ISO.git \
            /workspace/CachyOS-Live-ISO

          /workspace/build.sh \
            --upstream /workspace/CachyOS-Live-ISO \
            --name macbook-cachyos \
            --no-build

          cd /workspace/CachyOS-Live-ISO
          ./buildiso.sh -p desktop -v -w 2>&1 | tee /workspace/build.log
          grep -qF \
            'CachyOS Calamares configuration extended for MacBook hardware.' \
            /workspace/build.log

          cd /workspace/CachyOS-Live-ISO/out/desktop
          mapfile -t iso_files < <(
            find . -maxdepth 1 -type f -name '*.iso' -print
          )
          if [[ ${#iso_files[@]} -ne 1 ]]; then
            echo "Expected exactly one built ISO, found ${#iso_files[@]}." >&2
            exit 1
          fi
          sha256sum -- "${iso_files[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
          CONTAINER_SCRIPT

      - name: Collect failure diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          cp "$GITHUB_WORKSPACE/build.log" \
            "$GITHUB_WORKSPACE/diagnostics/" 2>/dev/null || true
          cd "$GITHUB_WORKSPACE"
          find CachyOS-Live-ISO -maxdepth 3 -type f \
            \( -name '*.log' -o -name 'packages*.x86_64' \) \
            -exec cp --parents {} diagnostics/ \; 2>/dev/null || true
          df -h > diagnostics/disk-usage.txt

      - name: Upload ISO
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: macbook-cachyos-iso
          path: |
            CachyOS-Live-ISO/out/desktop/*.iso
            CachyOS-Live-ISO/out/desktop/*.pkgs.txt
            CachyOS-Live-ISO/out/desktop/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-diagnostics
          path: diagnostics
          if-no-files-found: ignore
          retention-days: 7
