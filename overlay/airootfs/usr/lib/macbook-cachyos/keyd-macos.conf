# Applied only after first-boot verifies Apple MacBook hardware.
#
# Command behaves like macOS for application shortcuts while the combinations
# owned by Plasma (Spotlight, app switching, minimize and screenshots) continue
# to emit Meta. Option retains normal Alt behavior with macOS-style word motion.
#
# Escape path: disable keyd.service or remove /etc/keyd/orchard-macos.conf.
# keyd's emergency stop chord is Backspace+Escape+Enter.

[ids]
*

[main]
leftmeta = layer(command)
rightmeta = layer(command)
leftalt = layer(option)
rightalt = layer(option)

[command:C]
space = M-space
tab = M-tab
grave = M-grave
m = M-m
left = home
right = end
up = C-home
down = C-end

[option:A]
left = C-left
right = C-right
backspace = C-backspace
delete = C-delete

[command+shift]
3 = M-S-3
4 = M-S-4
5 = M-S-5
