Section "InputClass"
    Identifier "bcm5974 precise scrolling"
    MatchProduct "bcm5974"
    MatchIsTouchpad "on"
    Driver "libinput"

    Option "Tapping" "on"
    Option "NaturalScrolling" "true"
    Option "DisableWhileTyping" "true"
    Option "ClickMethod" "clickfinger"
    Option "ScrollMethod" "twofinger"

    # libinput reports fractional wheel clicks, so this slows scrolling
    # without dropping events or introducing the stepping caused by Synaptics.
    Option "ScrollPixelDistance" "40"
EndSection
