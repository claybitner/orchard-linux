# CachyOS Calamares pacstrap configuration, extended for Intel MacBooks.
# Verified against cachyos-calamares 3.4.2-4 on 2026-07-28.
---
basePackages:
  - base
  - base-devel
  - btrfs-progs
  - cachyos-hooks
  - cachyos-keyring
  - cachyos-mirrorlist
  - cachyos-v4-mirrorlist
  - cachyos-v3-mirrorlist
  - cachyos-rate-mirrors
  - cachyos-settings
  - cryptsetup
  - device-mapper
  - diffutils
  - dosfstools
  - e2fsprogs
  - efibootmgr
  - exfatprogs
  - f2fs-tools
  - inetutils
  - jfsutils
  - less
  - linux-cachyos
  - linux-cachyos-headers
  - linux-cachyos-lts
  - linux-cachyos-lts-headers
  - linux-firmware
  - logrotate
  - lsb-release
  - lvm2
  - man-db
  - man-pages
  - mdadm
  - chwd
  - mkinitcpio
  - netctl
  - os-prober
  - perl
  - python
  - s-nail
  - sudo
  - sysfsutils
  - texinfo
  - usbutils
  - which
  - xfsprogs
  - plymouth
  - cachyos-plymouth-bootanimation
  - cachyos-plymouth-theme

  # MacBook hardware support. These are official Arch/CachyOS packages.
  - broadcom-wl-dkms
  - dkms
  - wireless-regdb
  - networkmanager
  - iwd
  - iw
  - rfkill
  - pciutils
  - dmidecode
  - intel-ucode
  - thermald
  - power-profiles-daemon
  - fwupd

postInstallFiles:
  - "/etc/mkinitcpio.conf"
  - "/usr/local/bin/dmcheck"
  - "/usr/local/bin/remove-nvidia"
  - "/etc/calamares/scripts/enable-ufw"
  - "/etc/calamares/scripts/bootloader-post-setup"
  - "/etc/calamares/scripts/shell-setup"
  - "/etc/calamares/scripts/btrfs-installation-snapshot"

  # Copy the overlay into the freshly pacstrapped target system.
  - "/etc/NetworkManager/conf.d/20-wifi-backend.conf"
  - "/etc/systemd/system/macbook-firstboot.service"
  - "/usr/lib/macbook-cachyos/firstboot"
  - "/usr/lib/macbook-cachyos/plasma-layout-once"
  - "/usr/lib/macbook-cachyos/setup-plasma"
  - "/usr/local/bin/macbook-diagnostic-bundle"
  - "/usr/local/bin/macbook-hardware-report"
  - "/usr/local/bin/macbook-optional-theme"
